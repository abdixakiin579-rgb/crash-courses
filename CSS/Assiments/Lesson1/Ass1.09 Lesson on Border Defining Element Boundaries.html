
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Gallery</title>

    <link rel="stylesheet" href="style.css">
    <style>

/* General page style */
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

/* General quote style */
.quote {
    margin: 20px;
    padding: 25px;
    background-color: white;
}

.quote p {
    font-size: 18px;
    line-height: 1.6;
}

/* Quote 1 */
#quote1 {
    border: 3px solid #ea5d0b;
    padding: 35px;
    background-color: #07c4f8;
    text-align: left;
    
}

/* Quote 2 */
#quote2 {
    border: 4px dotted #555;
    padding: 20px;
    background-color: #fff0f5;
    text-align: center;
}

/* Quote 3 */
#quote3 {
    border: 2px dashed #777;
    padding: 30px;
    background-color: #f0fff0;
    text-align: right;
    box-shadow: 3px 3px 8px #ccc;
}

/* Quote 4 */
#quote4 {
    border: 5px solid #888;
    padding: 25px;
    background-color: #fffbe6;
    text-align: left;
}


    </style>
</head>

<body>

    <h1>Quote Gallery</h1>

    <div class="quote" id="quote1">
        <p>"Logic will get you from A to B. Imagination will take you everywhere." - Albert Einstein</p>
    </div>

    <div class="quote" id="quote2">
        <p>"Be yourself; everyone else is already taken." - Oscar Wilde</p>
    </div>

    <div class="quote" id="quote3">
        <p>"So many books, so little time." - Frank Zappa</p>
    </div>

    <div class="quote" id="quote4">
        <p>"A room without books is like a body without a soul." - Marcus Tullius Cicero</p>
    </div>

</body>
</html>
