
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Layout</title>

    <style>
        .navbar {
            background-color: #0f9def;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 20px 0 30px 0;
        }

        .content-box {
            background-color: lightgray;
            border: 1px solid #555;
            padding: 30px;
            text-align: center;
            margin: 0 0 25px 0;
        }

        #box1 {
            background-color: lightblue;
        }

        #box2 {
            background-color: lightgreen;
        }

        #box3 {
            background-color: lightyellow;
        }

        .footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 35px 0 20px 0;
        }
        .header{
            text-align: center;
            background-color: #d20d90;
            font-size: medium;
        
        }
    </style>
</head>
<header class="header">My colars</header>
<body>

    <nav class="navbar">Navigation Bar</nav>

    <div class="content-box" id="box1">Content Box 1</div>

    <div class="content-box" id="box2">Content Box 2</div>

    <div class="content-box" id="box3">Content Box 3</div>

    <footer class="footer">Footer</footer>

</body>
</html>
