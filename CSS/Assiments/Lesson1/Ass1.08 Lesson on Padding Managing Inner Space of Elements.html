
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding Examples</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .text-block {
            margin: 20px;
            border: 2px solid #333;
        }

        /* Generous padding */
        #block1 {
            padding: 50px;
            background-color: lightblue;
        }

        /* Minimal padding */
        #block2 {
            padding: 10px;
            background-color: lightgreen;
        }

        /* Balanced padding */
        #block3 {
            padding: 25px;
            background-color: lightyellow;
        }
        .header{
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
   <header class="header">My  blocks</header>
<body>

    <div class="text-block" id="block1">
        Text Block 1 - Notice the spacious layout inside.
    </div>

    <div class="text-block" id="block2">
        Text Block 2 - A more snug appearance.
    </div>

    <div class="text-block" id="block3">
        Text Block 3 - Perfect for reading with balanced spacing.
    </div>

</body>
</html>
