
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interests Page</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        
body {
    font-family: Arial, sans-serif;
    margin: 0;
}

/* General section styling */
.interest-section {
    width: 80vw;
    height: 50vh;
    margin: 5vh auto;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
}

/* Section colors */
#books {
    background-color: rgb(191, 237, 23);
}

#movies {
    background-color: rgb(30, 213, 245);
}

#foods {
    background-color: rgb(246, 21, 182);
}

/* Text styling */
.interest-section h1 {
    font-size: 24px;
    text-align: center;
}

.interest-section p {
    font-size: 16px;
    text-align: center;
}

/* List styling */
.interest-section ul {
    display: inline-block;
    text-align: left;
    font-size: 16px;
    line-height: 1.8;
}


    </style>
</head>

<body>

    <div class="interest-section" id="books">
        <h1>Books</h1>
        <p>My favorite books:</p>

        <ul>
            <li>The Alchemist</li>
            <li>Atomic Habits</li>
            <li>Rich Dad Poor Dad</li>
            <li>The Power of Now</li>
        </ul>
    </div>

    <div class="interest-section" id="movies">
        <h1>Movies</h1>
        <p>My favorite movies:</p>

        <ul>
            <li>Avatar</li>
            <li>Inception</li>
            <li>Interstellar</li>
            <li>Black Panther</li>
        </ul>
    </div>

    <div class="interest-section" id="foods">
        <h1>Foods</h1>
        <p>My favorite foods:</p>

        <ul>
            <li>Pizza</li>
            <li>Rice and Chicken</li>
            <li>Burger</li>
            <li>Pasta</li>
        </ul>
    </div>

</body>
</html>
