<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation Page</title>

    <style>
        body {
            background-color: #f4f4f4;
            text-align: center;
            padding: 80px;
        }

        .quote {
            font-family: Georgia, serif;
            font-size: 30px;
            font-style: italic;
            color: #2c8afc;
            margin-bottom: 20px;
        }

        .author {
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            color: #fe0d0d;
        }
    </style>
</head>

<body>

    <div class="quote">
        "Qofna usabar Qofna kasabar waa tiirka nolosha."
    </div>

    <div class="author">
        — Eleanor Roosevelt
    </div>

</body>
</html>
